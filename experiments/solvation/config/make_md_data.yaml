# Config file specifying the setup of a Boltzmann Generator
hydra:
  searchpath:
    - file://${oc.env:MAIN_DIR}/config

defaults:
  - entry 
  - _self_

solvent: water                      # Name of solvent molecules (currently only water is supported).
solute: so2                        # Name of the solute molecule. Default is so2.
solute_pdb_path: ${node.data_dir}/molecules/solutes/${solute_name}.pdb           # Filepath to solvent pdb
solute_xml_path: ${node.data_dir}/molecules/solutes/${solute_name}.xml           # Filepath to solvent xml; not needed for water solute.

solute_inpcrd_path: null                                              # Filepath to solvent inpcrd; currently unused.
solute_prmtop_path: null                                              # Filepath to solvent prmtop; currently unused.
out_dir: ${node.data_dir}/molecules/md/${solute_name}/                # Where to store resulting MD frames.

run_md: true                            # Run the MD simulation true/false.

num_solvent_molecules: 5                # Number of solvent molecules to simulate.
temperature: 300.0                      # Temperature in Kelvin.
femtoseconds_per_timestep: 0.5          # Timestep size in femtoseconds (e.g., 0.5 means a timestep is 0.5fs)
equi_steps: 1e4                         # Equilibration steps.
burnin_steps: 1e5                       # Burn-in steps.
num_steps: 1e7                          # Total number of steps to simulate after equilibration and burn-in.
report_interval: 1e3                    # Reporting / printing (stdout).
save_interval: 10                       # Save every this many steps. Total frames saved is num_steps / save_interval.
external_constraints: true              # Use external constraints.
internal_constraints: "none"            # "none" or "hbonds": "none" for non-rigid water molecules.
rigid_water: false                      # Rigid water molecules true/false.
constraint_radius: 0.3                  # Radius of the constraint sphere around the center in nm. Should be rounded to whole Angstrom.
constraint_force: 10000.0               # Force constant of the spherical droplet constraint in kJ/mol/nm^2
platform_name: "CUDA"                   # OpenMM platform to use for energy calculations in buffer: "CUDA", "CPU", "OpenCL", "Reference", or "None"

plot:
  md_diagnostics: true                 # Plot MD diagnostics after simulation true/false.
  show: false                           # Show plots interactively true/false.
  save_dir: ${out_dir}plots/            # Directory to save plots; if null, plots are not saved.
