# Config file specifying the setup of a Boltzmann Generator  
defaults:
  - entry 
  - _self_

hydra:
  searchpath:
      - file://${oc.env:MAIN_DIR}/config
  run:
    dir: ${node.output_dir}/LJ/MD_training/${now:%Y-%m-%d}/${now:%H-%M-%S_%f} # Default Hydra output dir: all run output will be stored in subfolders of this.
  job:
    chdir: true

target:                                         # Properties of particle system
  temperature: 100                              # Double, temperature of the system
  energy_cut: 1.e+12                             # Double, energy level at which regularization shall be applied
  energy_max: 1.e+24                            # Double, maximum level at which energies will be clamped
  n_threads: 1                                  # Int, number of threads to be used, number of cores if null (ONLY ON CPU/Reference))
  switch_nm: 0.5                                # Switching distance; tau = 0.2 ps -> gamma = 1/tau = 5 ps^-1

  # PBC system parameters
  transform_version: v1                         # which transform to use: v1, v1_sorted, v2, v2_sorted
  cartesian_dim: 300                            # System dimension: 3 * (n_solvent + n_solute) (xyz).
  n_solvent: 99                                 # Number of solvent particles to simulate.                       
  box_length_nm: 1.69                           # Length of the box
  nonbonded_cutoff_nm: 0.8                      # Nonbonded cutoff in nm; should be larger than the largest possible distance between two particles in the box 
  grid_spacing_nm: 0.36                         # Minimum distance between particles during initialization in nm; should be smaller than the solvent size to avoid large overlaps. 

  # solvent LJ params
  solvent_sigma_nm: 0.34                        # Solvent particles size parameter in nm.
  solvent_epsilon_kjmol: 0.996                  # Solvent particles energy parameter in kJ/mol.
  solvent_mass_amu: 39.9                        # Solvent particle mass in atomic mass units (amu).

  # one fixed solute
  solute_positions_nm:
    - [0.90, 0.90, 0.90]

  solute_sigma_nm: 0.30                         # Solute particle size parameter in nm.
  solute_epsilon_kjmol: 0.996                   # Solute particle energy parameter in kJ/mol.
  solute_mass_amu: 39.9                          # Solutes masses in atomic mass units (amu);kept fixed.

  constrain_solutes: true
  solute_solute_interaction: false

  # Nosé–Hoover collision frequency.
  # OpenMM docs suggest using a larger value for initial equilibration.
  nose_hoover_collision_ps: 25.0
  solid: false


  # MD simulation parameters
  femtoseconds_per_timestep: 1.5                # Timestep size in femtoseconds (e.g., 0.5 means a timestep is 0.5fs)
  gradient_steps: 5e4                           # Gradient steps.
  nh_steps: 5e5                                 # Nosé–Hoover steps; should be large enough to equilibrate the system at the target temperature. 
  burnin_steps: 5e5                             # Burn-in steps.
  production_steps: 7_000_000                   # Production steps; 10.5 ns at dt = 1.5 fs = 7,000,000 steps
  save_interval: 7e4                            # Save every this many steps. Total frames saved is num_steps / save_interval.
  diagnostics_filename: run_statistics.txt      # Where to store MD diagnostics plots.

  # Filepaths to load samples from
  base_state: v1                                # Base state MD simulation
  target_state: v2                              # Target state MD simulation
  samples_file: traj_lj_particles.h5
  train_samples_path: ${node.data_dir}/LJ/md/${target.base_state}/${target.samples_file}
  val_samples_path: ${node.data_dir}/LJ/md/${target.target_state}/${target.samples_file}
  test_samples_path: null
  platform_name: CUDA                 # OpenMM platform to use for energy calculations in buffer: "CUDA", "CPU", "OpenCL", "Reference", or "None"

  # Curriculum learning parameters
  curriculum_type: null
  curriculum_lambda: 1.0
  curriculum_soft_energy_cut: 0.0
  seed: 0


flow:                                 # Properties of the flow model
  type: realnvp                       # String, type of flow model; currently only supports 'realnvp'
  base:
    type: gauss-uni
    params: null
    learn_mean_var: false             # Bool, flag whether to learn mean and variance of base distribution.
    shell_radii_nm: [0.34, 0.42, 0.52]
    # shell_weights: [0.40, 0.50, 0.62]
    
    # shell_weights: [0.20, 0.45, 0.35]
    shell_weights: [0.45, 0.35, 0.20]
    component_sigma_unit: 0.018
    n_directions: 48
    add_uniform_component: false
    image_range: 1
    uniform_weight: 0.10 

  n_layers: 36                        # Int, number of layers of the flow;
  layer_nodes_per_dim: 1              # Int, layer nodes per dimension
  hidden_units: 256                   # Int, number of hidden units of the NN in neural spline layers
  n_hidden_conditioner: 2
  num_bins: 8                         # Int, number of bins of the neural splines
  init_identity: True                 # Bool, flag whether to initialize layers as identity map
  dropout: 0.                         # Float, dropout probability for the NN layers
                                      # For below: if specified, a permutation, and a affine coupling layer
  circ_shift: random                  # String, whether to shift circular coordinates, can be none, constant, or random
  act_norm: False                      # Bool, flag whether to include an ActNorm layers
  mixing: null                        # String, how features are mixed
  tail_bound: 4.0                     # Float, tail bound for spline flows; assumes data is roughly standardized to unit variance.
  group_size: 6                       # Int, size of groups for coupling layers; should be 6 for solvent flows (corresponding to xyz of each molecule)


fab:  
  loss_type: fab_alpha_div            # Whether to use AIS, and type of loss for AIS. Default 'fab_alpha_div' uses AIS. If non-AIS, rest of args only used for potential eval.
  use_ais: true                       # Whether to use AIS for evaluation still. Default is true.
  n_intermediate_distributions: 8     # Int, number of intermediate distributions
  alpha: 2.0
  transition_operator:
    type: hmc                         # Type of MCMC transition to use; hmc=Hamiltonian Monte Carlo.
    n_inner_steps: 4                  # Number of leapfrog steps to take in each HMC transition.
    init_step_size: 0.05              # original eps = 0.1 / 2
    tune_step_size: true              # Bool, flag whether to adjust step size for Metropolis
    target_p_accept: 0.65             # Target acceptance probability for Metropolis-Hastings step size tuning.


training:                             # Properties of the training procedure
  only_test_run: false                # Bool, whether to only run a test run (for debugging) and then return, or to run the full training procedure.
  seed: 0                             # Int, seed to be used for the random number generator
  num_workers: 4                      # Int, number of workers to be used for data loading
  # Only for when we continueing same with new stage run
  checkpoint_load_dir: null           # Checkpoint dir to load from if continuing training
  load_optimizer_state: false         # Use optimizer from checkpoint model; only set to true we continueing same run
  latest_run: false                   # Wheter to pick the latest run in the load folder defined by checkpoint_load_dir or use a specific run
  continue_same_run: false            # Wheter to continue same run or do stage training

  n_iterations: 50000                 # Int, maximum number of iteration
  n_flow_forward_pass: null            # Int, alternative way of setting training time: number of training passes through the flow model.
  batch_size: 1024                    # Int, batch size used during training
  tlimit: null                        # Int, time limit of run in seconds
  use_gpu: true
  use_64_bit: true
  lr: 7.e-5                           # Double, learning rate
  wd: 1.e-5                           # Double, regularization parameter
  optimizer: adam                     # String, name of the optimizer
  lr_scheduler:
    type: cosine                      # String, kind of LR scheduler, can be step, exponential, cosine, cosine_restart
    rate_decay: 1                     # Double, rate of decay for exponential scheduler or LRStep.
    decay_iter: 1                     # Int, number of iterations before decay for exponential scheduler or LRStep.
  warmup_iter: 0                    # Int, number of iterations used for warmup
  max_grad_norm: 1                    # Double, limit for gradient clipping
  energy_mode: full
  n_pretraining: null                 # Int, number of iterations to pretrain forwardkl; if null using full MD data size for training.
  transfer_learning: false            # Bool, whether to use transfer learning
  buffer:                             # Buffer args follow below here 
    use: true                         # Whether to use a replay buffer during training.
    prioritised: true                 # If True then FAB loss WILL be used no matter what fab.loss_type is.
    
    # Only used when buffer.use is true:
    maximum_length: 524288            # ALDP used 512 * 1024 (batch_size)
    min_length: 65536                 # ALDP used 64 * 1024 (batch_size); this means a long initial step where the buffer is filled to this number of samples!
    n_batches_sampling: 8             # Number of updates (batches) to do after every buffer sampling step
    w_adjust_max_clip: 10             # clipping of weight adjustment factor for prioritised replay
    temp: 1.0                         # Rate that we weight new experience over old (for non-prioritised replay only)
    log_w_clip_frac: null             # Null for no clipping, for non-prioritised replay only.
    load_buffer: false
  
  # Only for reverse kl
  mixing: 0.0                         # Rate of MD sample to include into the loss; TODO currently only implemented from reverse kl side!!
  overlap:                # Rate to which we penalize overlap in the data.
    penalty: 0.0                     # Penalty for overlap; currently implemented as a hard penalty on the energy of the system when particles are closer than a certain distance.
    dist_ssolv: 0.31                  # Distance under which we consider particles to be overlapping in nm; should be smaller than solvent size to avoid penalizing valid configurations.
    dist_solute: 0.31                 # Distance under which we consider solute and solvent particles to be overlapping in nm; should be smaller than solvent size to avoid penalizing valid configurations.
  save_traj: false                    # Whether to save a trajectory of the flow samples during training.

evaluation:
  eval_mode: "val"                    # String, mode of evaluation, can be "val" or "test"
  print_eval: true                    # Bool, flag whether to print evaluation results to stdout.
  plot_MD_energies: false             # Bool, flag whether to plot MD energies as a sanity check.
  plot_marginal_hists: false          # Bool, flag whether to plot the marginal histograms of the MD data vs Flow data. Mostly used for debugging.
  n_plots: 10              # null     # number of times we visualise the model throughout training.
  n_eval: 500                         # for calculating metrics of flow w.r.t target.
  eval_batch_size: 1024               # For AIS-type evaluation, must be a multiple of inner batch size (`batch_size`)
  n_checkpoints: 1                    # number of model checkpoints saved


logger:
  wandb:
    name: LJ_B${target.base_state}_T${target.target_state}_${fab.loss_type}_dim${target.cartesian_dim}_nl${flow.n_layers}
    project: LJ_${fab.loss_type}
    entity: ${user.wandb.entity}
#  pandas_logger:
#    save_period: 100                 # how often to save the pandas dataframe as a csv